# XpTresor - English messages. Colors: &a &l ... and &#rrggbb. Empty text = message is not sent.
prefix: "&8[&bXP Vault&8] &r"

players-only: "&cOnly players can do that."
no-permission: "&cYou don't have permission to do that."
unknown-command: "&cUnknown command. &7/{cmd} help"
number-invalid: "&cPlease enter a valid number."
player-unknown: "&cPlayer &e{player}&c has no account."

usage:
  deposit: "&7Usage: &e/{cmd} deposit <levels|XPp|all>"
  withdraw: "&7Usage: &e/{cmd} withdraw <levels|XPp|all>"
  send: "&7Usage: &e/{cmd} send <player> <levels|XPp|all>"
  auto: "&7Usage: &e/{cmd} auto [on|off|<level>]"
  repair: "&7Usage: &e/{cmd} repair [all]"
  info: "&7Usage: &e/{cmd} info <player>"
  balance: "&7Usage: &e/{cmd} balance <player>"
  admin: "&7Usage: &e/{cmd} admin <give|take|set> <player> <levels|XPp>&7, &e/{cmd} admin reset <player>&7, &e/{cmd} admin import"

words:
  enabled: "&aon"
  disabled: "&coff"
  positive: "&ayes"
  negative: "&cno"
  unlimited: "unlimited"
  levels: "{levels} levels"
  offline-default: "&8(offline: default limit)"

balance:
  self: "&7In your vault: &a{levels} levels &8({xp} XP)"
  self-details: "&7Withdrawable now: &a+{now} levels &8| &7Limit: &a{limit}"
  other: "&e{player}&7 has &a{levels} levels &8({xp} XP)&7 in their vault."

deposit:
  done: "&7Deposited &a{levels} levels &8({xp} XP)&7. Vault: &a{balance} levels"
  partial: "&eVault is full now: deposited &a{levels} levels &8({xp} XP)&7. Vault: &a{balance} levels"
  not-enough-levels: "&cYou only have &e{levels} levels&c."
  not-enough-points: "&cYou only have &e{xp} XP&c."
  nothing: "&cYou have no XP to deposit."
  minimum: "&cDeposit at least &e{levels} levels &8({xp} XP)&c."
  full: "&cYour vault is full &8(limit {limit} levels)&c."
  too-much: "&cThat doesn't fit anymore - room for &e{xp} XP&c. Tip: &e/xpt deposit all"

withdraw:
  done: "&7Withdrew &a+{levels} levels &8({xp} XP)&7. Vault: &a{balance} levels"
  empty: "&cYour vault is empty."
  not-enough-levels: "&cNot enough in the vault - you can withdraw &e{max} levels&c right now."
  not-enough-points: "&cThe vault only holds &e{xp} XP&c."

send:
  done: "&7You sent &e{player} &a{xp} XP &8(≈{levels} levels)&7."
  received: "&e{player} &7sent &a{xp} XP &8(≈{levels} levels)&7 to your vault."
  self: "&cYou can't send XP to yourself."
  not-enough: "&cYour vault only holds &e{levels} levels &8({xp} XP)&c."
  receiver-full: "&cThe vault of &e{player}&c is too full - room for &e{free} XP&c."
  offline-disabled: "&e{player}&c is offline."

auto:
  enabled: "&7Auto-deposit &aon&7: from level &a{level}&7 on, your XP goes into the vault automatically."
  disabled: "&7Auto-deposit &coff&7."
  min: "&cThe lowest possible level is &e{min}&c."
  deposited: "&bAuto-deposit: &a{levels} levels &8({xp} XP) &7→ vault: &a{balance} levels"
  full: "&eAuto-deposit: your vault is full &8(limit {limit} levels)&e."

repair:
  done: "&7Repaired &a{items} item(s)&7 for &a{xp} XP&7 from your vault."
  partial: "&eNot enough XP in the vault - partially repaired for &a{xp} XP&e."
  nothing: "&cThere is nothing to repair."
  no-mending: "&cOnly items with &aMending&c can be repaired."
  invalid: "&cHold a damaged item."
  armored-elytra: "&cArmored elytras only work while ArmoredElytra is installed - use an anvil."
  empty: "&cYour vault is empty."
  disabled: "&cRepairing with XP is disabled."

bottle:
  done: "&7Filled &a{amount} bottle(s)&7 with &a{xp} XP &8(level 0→{levels})&7 each."
  usage: "&7Usage: &e/{cmd} bottle <levels|XPp> [amount]"
  max: "&cAt most &e{max}&c bottles at once."
  not-enough: "&cYou need &e{needed} XP&c, your vault holds &e{xp} XP&c."
  dropped: "&eInventory full - some bottles were dropped at your feet."
  disabled: "&cXP bottles are disabled."
  name: "&bXP Bottle &7({xp} XP)"
  lore: "&7Contains exactly &a{xp} XP &7(level 0→{levels}). Throw it to release the XP."

top:
  header: "&8&m------&r &bXP Vault Top &7({page}/{pages}) &8&m------"
  line: "&7{rank}. &e{player} &8- &a{levels} levels &8({xp} XP)"
  empty: "&7Nobody has XP in their vault yet."

info:
  header: "&8&m------&r &bXP Vault: &e{player} &8&m------"
  balance: "&7Vault: &a{levels} levels &8({xp} XP)"
  limit: "&7Limit: &a{limit}"
  auto: "&7Auto-deposit: {state} &8(from level {level})"
  keepxp: "&7Keeps XP on death: {state}"
  imported: "&7Imported from XP-Deposit: {state}"
  uuid: "&8{uuid}"

admin:
  give: "&e{player}&7 got &a+{xp} XP &8(level 0→{levels})&7. Now: &a{balance} levels"
  take: "&7Took &c{xp} XP&7 from &e{player}&7. Now: &a{balance} levels"
  set: "&7Set the vault of &e{player}&7 to &a{xp} XP &8({levels} levels)&7."
  reset: "&7Emptied the vault of &e{player}&7."
  not-enough: "&e{player}&c only has &e{xp} XP&c in their vault."
  notify-give: "&e{by}&7 put &a{xp} XP&7 into your vault."
  notify-take: "&e{by}&7 took &c{xp} XP&7 from your vault."
  notify-set: "&e{by}&7 set your vault to &a{xp} XP&7."
  notify-reset: "&e{by}&7 emptied your vault."

import:
  none: "&cNo XP-Deposit accounts found &8({folder})&c."
  preview: "&7Found &a{count} accounts &7with &a{xp} XP &7in total &8({already} already imported)&7. To import: &e/{cmd} admin import confirm"
  done: "&aImported {imported} accounts &8({xp} XP)&7, &e{skipped}&7 were already imported."

reload: "&aConfig and messages reloaded."

help:
  hint: "&8» &7All commands: &e/{cmd} help"
  header: "&8&m------&r &bXP Vault &8&m------"
  deposit: "&e/{cmd} deposit <amount> &8- &7put XP into the vault"
  withdraw: "&e/{cmd} withdraw <amount> &8- &7take XP out of the vault"
  balance: "&e/{cmd} balance [player] &8- &7what's in the vault?"
  top: "&e/{cmd} top [page] &8- &7leaderboard"
  send: "&e/{cmd} send <player> <amount> &8- &7send XP to someone's vault"
  auto: "&e/{cmd} auto [on|off|<level>] &8- &7deposit automatically from a level on"
  repair: "&e/{cmd} repair [all] &8- &7repair Mending items with vault XP"
  bottle: "&e/{cmd} bottle <levels> [amount] &8- &7fill XP into bottles"
  amounts: "&8Amount: &710 &8= levels, &7500p &8= XP points, &7all"
  admin-header: "&8&m------&r &cAdmin &8&m------"
  info: "&e/{cmd} info <player> &8- &7account details"
  admin: "&e/{cmd} admin <give|take|set|reset> <player> [amount]"
  import: "&e/{cmd} admin import &8- &7take over the accounts of XP-Deposit"
  reload: "&e/{cmd} reload &8- &7reload the config"
