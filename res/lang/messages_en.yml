# XpTresor - English messages. Colors: &a &l ... and &#rrggbb. Empty text = message is not sent.
prefix: "&8[&bXP Vault&8] &r"

players-only: "&cOnly players can do that."
no-permission: "&cYou don't have permission to do that."
unknown-command: "&cUnknown command. &7/{cmd} help"
number-invalid: "&cPlease enter a valid number."
player-unknown: "&cPlayer &e{player}&c has no account."

usage:
  deposit: "&7Usage: &e/{cmd} deposit <levels|XPp|all>"
  withdraw: "&7Usage: &e/{cmd} withdraw <levels|XPp|all>"
